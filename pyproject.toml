[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medlit-agent"
version = "0.1.0"
description = "A citation-grounded medical literature assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",

    "fastapi>=0.142,<0.143",
    "pypdf>=6.19,<7",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn>=0.53,<0.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
